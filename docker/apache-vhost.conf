# Latch demo vhost for the Docker image (DocumentRoot = source/public only).
<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/latch/source/public

    <Directory /var/www/latch/source/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
    </Directory>

    <Directory /var/www/latch>
        Require all denied
    </Directory>
    <Directory /var/www/latch/source/public>
        Require all granted
    </Directory>
    <Directory /persist>
        Require all denied
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/latch-error.log
    CustomLog ${APACHE_LOG_DIR}/latch-access.log combined
</VirtualHost>
