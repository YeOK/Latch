# /etc/fail2ban/filter.d/latch-login.conf
# Latch login abuse — prefer security.log (real client IPs behind Cloudflare/proxies).
# JSON lines from Latch SecurityLog (see source/docs/SECURITY.md).
#
# Alternate: point logpath at Apache access log and rely on the POST failregex
# (needs mod_remoteip or direct client connections — see packaging/latch-remoteip.conf).
[Definition]

failregex = ^\{[^\n]*"event"\s*:\s*"login_fail"[^\n]*"ip"\s*:\s*"<HOST>"
            ^\{[^\n]*"ip"\s*:\s*"<HOST>"[^\n]*"event"\s*:\s*"login_fail"
            ^\{[^\n]*"event"\s*:\s*"login_totp_fail"[^\n]*"ip"\s*:\s*"<HOST>"
            ^\{[^\n]*"ip"\s*:\s*"<HOST>"[^\n]*"event"\s*:\s*"login_totp_fail"
            ^<HOST> -.*"POST /login(?:/2fa)?/? HTTP/[\d.]+" 200 \S+

ignoreregex = ^(?:127\.0\.0\.1|::1) -

# JSON ts first (ISO-8601); Apache combined [date] when watching the access log.
datepattern = ^\{"ts":"({DATE})
              ^[^\[]*\[({DATE})
              {^LN-BEG}
